button{font-family:inherit;cursor:pointer;color:inherit}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;margin:0}
a{color:var(--pr)}
.app{position:relative;height:100dvh;display:flex;overflow:hidden;background:var(--bg)}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.sb{position:absolute;top:0;bottom:0;inset-inline-start:0;z-index:30;width:262px;transform:translateX(-105%);transition:transform .25s ease;background:var(--card);border-inline-end:1px solid var(--bd);padding:10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
[dir=rtl] .sb{transform:translateX(105%)}
.sb.open{transform:none;box-shadow:0 0 40px rgba(20,33,27,.3)}
.scrim{position:absolute;inset:0;background:rgba(20,33,27,.45);z-index:20;display:none}
.scrim.on{display:block}
@media(min-width:900px){.sb,[dir=rtl] .sb{position:static;transform:none;box-shadow:none!important;flex:none}.burger,.scrim{display:none!important}}
.top{display:flex;align-items:center;flex-wrap:wrap;justify-content:space-between;gap:12px;padding:12px 28px;background:var(--card);border-bottom:1px solid var(--bd)}
.notice{padding:8px 28px;background:var(--warn);color:var(--warnt);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{flex:1;overflow:auto;min-height:0}
.foot{padding:14px 48px;border-top:1px solid var(--bd);display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;color:var(--mu);font-size:14px;background:var(--card)}
.pad{padding:24px 48px}
.pad2{padding:24px 28px;max-width:960px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:18px;display:flex;flex-direction:column;gap:10px}
.mu{color:var(--mu)}.sm{font-size:13px}
.btn{min-height:44px;padding:0 22px;border:0;border-radius:999px;background:var(--pr);color:#fff;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
.btn.bad{background:var(--card);color:var(--bad);border:1px solid var(--bad)}
.btn.sm2{min-height:36px;padding:0 14px;font-size:13px}
.chip{min-height:40px;padding:0 16px;border-radius:999px;font-weight:600;font-size:14px;border:1px solid var(--ln);background:var(--card);color:var(--tx)}
.chip.on{border:0;color:#fff}
.in{width:100%;min-height:48px;border:1px solid var(--ln);border-radius:12px;padding:0 14px;font:16px 'Hanken Grotesk',sans-serif;background:var(--in);color:var(--tx)}
textarea.in{padding:12px;min-height:80px;resize:vertical}
label.l{font-size:14px;font-weight:600;margin-top:4px;display:block}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.nav{width:100%;min-height:clamp(29px,4.8vh,44px);padding:0 10px;border:0;border-radius:12px;display:flex;align-items:center;gap:10px;text-align:start;font-weight:600;font-size:14.5px;background:transparent}
.nav i{flex:none;width:30px;height:30px;border-radius:10px;font-style:normal;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.nav i b{display:block;font-weight:400;animation:bob 2.6s ease-in-out infinite}
.nav:hover i b{animation:wiggle .6s ease-in-out infinite}
.nav.on i{transform:scale(1.1)}.nav.on i b{animation:pop 1.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.25) rotate(-6deg)}}
@media(prefers-reduced-motion:reduce){.nav i b{animation:none!important}}
.ib{width:44px;flex:none;min-height:44px;border:0;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.av{flex:none;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;background-size:cover;background-position:center}

.logotile{background:var(--tile);border-radius:22px;display:flex;align-items:center;justify-content:center;padding:14px}
.logotile img{display:block;max-width:100%;height:auto}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--chat)}
.bub{max-width:80%;padding:10px 14px;border-radius:16px;box-shadow:0 1px 2px rgba(20,33,27,.08);word-break:break-word}
.bub.me{background:var(--pr);color:#fff;border-end-end-radius:4px}
.bub.ot{background:var(--card);border-end-start-radius:4px}
.pic{max-width:240px;width:100%;border-radius:12px;display:block;cursor:pointer}
.tag{padding:1px 8px;border-radius:999px;background:#E8A33D;color:#14211B;font-size:11px;font-weight:600}
.act{background:none;border:0;padding:0;font-size:12px;opacity:.75;text-decoration:underline;margin-inline-end:8px}
.pinbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--warn);color:var(--warnt);font-size:14px;cursor:pointer;border-bottom:1px solid var(--bd)}
.ov{position:absolute;inset:0;z-index:60;overflow:auto;background:transparent;display:flex;align-items:center;justify-content:center;padding:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box .in,.box select.in{min-height:44px;font-size:15px}.box .seg button,.box .tabs button{min-height:40px}
.ov .box{position:relative;z-index:2;width:100%;max-width:430px;margin:auto;background:var(--card);border:1px solid rgba(255,255,255,.35);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:8px;box-shadow:0 18px 50px rgba(0,0,0,.35);animation:rise .6s ease-out both}
.still{animation:none!important}.lg{animation:bob2 4s ease-in-out infinite}
#authbg{position:absolute;inset:0;z-index:55;overflow:hidden;background:linear-gradient(135deg,#072b21,#0E6B4F 45%,#1c3f9a 85%)}
.gridbg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:36px 36px}
.blob{position:absolute;border-radius:50%;will-change:transform}
.b1{width:320px;height:320px;background:radial-gradient(circle,rgba(232,163,61,.5),transparent 70%);top:-100px;left:-90px;animation:drift 16s ease-in-out infinite}.b2{width:380px;height:380px;background:radial-gradient(circle,rgba(18,163,163,.5),transparent 70%);bottom:-120px;right:-110px;animation:drift 19s ease-in-out infinite reverse}
.fl{position:absolute;bottom:-60px;opacity:0;will-change:transform,opacity;animation:floatup linear infinite}
.fm{position:absolute;color:#fff;opacity:.14;font:italic 600 20px 'Bricolage Grotesque',serif;white-space:nowrap}
@keyframes drift{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(30px,24px,0)}}
@keyframes floatup{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.7}90%{opacity:.7}100%{transform:translateY(-115vh) translateX(25px) rotate(25deg);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hours{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;color:#fff;background:linear-gradient(90deg,#0E6B4F,#2F6FDE,#7B4FD6,#0E6B4F);background-size:300% 100%;animation:shine 7s linear infinite;box-shadow:0 8px 24px rgba(47,111,222,.28);max-width:440px}
.hours .clk{font-size:26px;display:inline-block;animation:wiggle 2.4s ease-in-out infinite;transform-origin:50% 60%}
.hours small{display:block;opacity:.9;font-size:13px}
.live{display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.22);font-size:12px;font-weight:600}
.live i{width:8px;height:8px;border-radius:50%;background:#7CFFB2;animation:pulse 1.4s ease-out infinite}
@keyframes shine{to{background-position:300% 0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,255,178,.8)}100%{box-shadow:0 0 0 9px rgba(124,255,178,0)}}
@media(prefers-reduced-motion:reduce){#authbg,#authbg *,.ov .box,.lg,.hours,.hours *{animation:none!important}.fl{opacity:.5}}
.seg{display:flex;gap:6px;padding:4px;border-radius:999px;background:var(--chat)}
.seg button{flex:1;min-height:44px;border:0;border-radius:999px;font-weight:600;font-size:15px;background:transparent}
.seg button.on{background:var(--pr);color:#fff}
.tabs{display:flex;border-bottom:2px solid var(--bd)}
.tabs button{flex:1;min-height:44px;border:0;background:transparent;font-weight:600;font-size:16px;margin-bottom:-2px;color:var(--mu);border-bottom:3px solid transparent}
.tabs button.on{color:var(--pr);border-bottom-color:var(--pr)}
.err{padding:10px 12px;border-radius:10px;background:var(--badbg);color:var(--bad);font-size:14px;font-weight:600}
.okb{padding:10px 12px;border-radius:10px;background:var(--prs);color:var(--pr);font-size:14px;font-weight:600}
.pill{padding:6px 14px;border-radius:999px;background:var(--warn);color:var(--warnt);font-weight:600;font-size:14px;align-self:flex-start}
.tt{display:grid;grid-template-columns:80px repeat(5,1fr);gap:8px}
.badge{position:absolute;top:-6px;inset-inline-end:-6px;min-width:20px;height:20px;border-radius:10px;background:#A12B1F;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#14211B;color:#fff;padding:12px 18px;border-radius:12px;z-index:99;font-size:14px;max-width:90%;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pr{padding:10px 12px;border-radius:12px;background:var(--chat)}
.onlym{display:flex}.main{position:relative}.chatpg,.dmwrap{position:absolute;inset:0}.dmwrap{grid-template-rows:minmax(0,1fr)}.msgs{min-height:0}
.homehero{padding:24px 48px}.homelogo{max-height:340px}.smlogo{display:none!important}
@media(max-width:899px){
.biglogo{display:none!important}.smlogo{display:flex!important}.top{flex-wrap:nowrap!important;gap:8px!important}.top h2{font-size:20px!important;white-space:nowrap}.top .btn{padding:0 12px;min-height:40px}.top>div:last-child{gap:6px!important}.pad,.pad2{padding:16px}.homehero{padding:16px!important;gap:20px!important}.chatpg,.dmwrap{padding:12px!important}.top{padding:10px 16px}.foot{padding:12px 16px}.notice{padding:8px 16px}
.main h1{font-size:32px!important}.hidem{display:none!important}
.tt{grid-template-columns:44px repeat(5,1fr);gap:4px}.tt button,.tt div{font-size:11px!important;padding:10px 2px!important}
.dmwrap{grid-template-columns:1fr!important}.dmwrap.thr .dmside{display:none}.dmwrap:not(.thr) .dmthread{display:none}
}
@media(min-width:900px){.onlym{display:none!important}}
</style>

  const h=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return} if(!m)return;

 },

 apply(path,val){

  for(let i=0;i<path.length-1;i++){if(o[path[i]]==null||typeof o[path[i]]!=='object'){if(val==null)return;o[path[i]]={};}o=o[path[i]];}

 },

async function submitAuth(){
 if(S.busy)return;const reg=S.mode==='register';
 const bad=m=>{S.err=m;S.ok='';S.busy=false;renderAuth();};
 S.busy=true;S.err='';renderAuth();
 try{
  if(!crypto||!crypto.subtle)return bad('This browser cannot do secure login. Please open the site with https in an updated browser.');
  if(!DB.ready&&!(await DB.whenReady(5000)))return bad('Cannot reach the academy database. Check your internet and try again.');
  const u=fval('lUser').toLowerCase(),p=S.f.lPass||'';
  if(!reg){
   if(S.role==='admin'){if(u!=='admin'||await pbk(p,CFG.ADMIN.salt)!==CFG.ADMIN.hash)return bad('Wrong admin username or password.');return enter({u:'admin',name:'Admin',role:'admin'});}
   const a=DB.get('users/'+u);
   if(!a||a.role!==S.role)return bad('No '+S.role+' account found with this username.');
   if(await pbk(p,a.salt)!==a.hash)return bad('Wrong password. Please try again.');
   return enter({u,name:a.name,role:a.role,cls:a.cls});
  }
  const full=fval('rFull');
  if(!full)return bad('Please enter your full name.');
  if(!/^[a-z0-9_]{3,20}$/.test(u))return bad('Username needs 3 to 20 letters or numbers, with no spaces.');
  if(u==='admin'||DB.get('users/'+u))return bad('This username is already taken. Please choose another.');
  if(p.length<6)return bad('Password must be at least 6 characters.');
  if(p!==(S.f.lPass2||''))return bad('Passwords do not match.');
  const salt=rnd(32,'0123456789abcdef'),rec={role:S.role,name:full,salt,hash:await pbk(p,salt),ts:Date.now()};
  {
   const code=(S.f.rCode||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
   if(code.length<12)return bad('Please enter the full registration code.');
   const ch=await sha(code),c=await DB.fetchOne('codes/'+ch);
   if(!c)return bad('Invalid code. Please ask the academy for a new one.');
   if((c.role||'teacher')!==S.role)return bad(S.role==='student'?'That is a teacher code. Students need a student code.':'That is a student code. Teachers need a teacher code.');
   if(c.used)return bad('This code was already used.');
   if(c.exp<Date.now())return bad('This code has expired. Please ask the academy for a new one.');
   if(S.role==='student'){if(!classes()[c.cls])return bad('The class for this code no longer exists. Please ask for a new code.');rec.cls=c.cls;}
   await DB.set('codes/'+ch,{...c,used:true,by:u,usedAt:Date.now()});
  }
  await DB.set('users/'+u,rec);
  S.mode='login';S.ok='Account created. You can log in now.';S.busy=false;S.f.lPass='';S.f.lPass2='';S.f.rCode='';renderAuth();
 }catch(e){bad('Something went wrong. Please try again.');}
}

 const item=(peer,p,sub,t,unr)=>`<button style="${row(S.dmSel===peer)}" data-a="dmopen" data-v="${esc(peer)}">${av(p.name,peer,38)}<div style="min-width:0;flex:1"><div class="row" style="flex-wrap:nowrap"><strong style="font-size:15px">${esc(p.name)}</strong><span class="sm mu">${t||''}</span></div><div class="mu sm" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(sub)}</div></div>${unr?'<span class="badge" style="position:static">•</span>':''}</button>`;
 const cand=people().filter(x=>st||x.role!=='student');
 if(q){const r=cand.filter(x=>(x.name+' '+x.id+' '+(x.role==='student'?clsOf(x.cls).name:x.role)).toLowerCase().includes(q)).slice(0,40);return r.map(x=>item(x.id,x,roleTxt(x)+' · @'+x.id,'')).join('')||'<div class="mu sm">Nobody found.</div>';}
 const th=dmThreads(),seen=new Set(th.map(t=>t.peer));
 let h=th.map(t=>item(t.peer,t.p,(t.last.u===me?'You: ':'')+(t.last.k==='t'?t.last.text:t.last.k==='p'?'Photo':'PDF: '+t.last.name),tm(t.last.ts),t.last.u!==me&&t.last.ts>(+localStorage.getItem(dmSeenKey(t.peer))||0))).join('');
 if(!st){const rest=cand.filter(x=>!seen.has(x.id));if(rest.length)h+='<div class="sm mu" style="font-weight:600;margin-top:8px">Teachers &amp; admin</div>'+rest.map(x=>item(x.id,x,roleTxt(x),'')).join('');}
 return h||'<div class="mu sm">No chats yet. Search a name above to start one.</div>';
}

  const mine=[];Object.entries(DB.get('att')||{}).forEach(([d,byc])=>{const v=byc&&byc[u.cls]&&byc[u.cls][u.u];if(v)mine.push([d,v]);});mine.sort((a,b)=>b[0].localeCompare(a[0]));

/* ====== rendering ====== */
function renderMain(){
 const m=$('#main');if(!m)return;
 if(!S.user){m.innerHTML='';return;}
 const t=tabsFor().includes(S.tab)?S.tab:'home';S.tab=t;
 m.innerHTML=(render[t]||render.home)();
 if(t==='chat'||(t==='dm'&&S.dmSel))fillMsgs();
 S.dirty=false;
}
function renderAll(){renderChrome();renderMain();}
const typing=()=>{const a=document.activeElement,m=$('#main');return a&&m&&m.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName);};
function onData(p){
 if(!S.user){const sg=JSON.stringify(classes());if(sg!==S.csig&&!$('#auth input:focus,#auth select:focus')){S.csig=sg;renderAuth();}return;}
 const unrd=$('#top');renderChromeLite();
 const t=S.tab;
 if(t==='chat'||(t==='dm'&&S.dmSel)){fillMsgs();if(t==='dm'){const l=$('#dmlist');if(l&&!(document.activeElement&&document.activeElement.id==='dmq'))l.innerHTML=dmList();}return;}
 if(typing()){S.dirty=true;return;}
 renderMain();
}
function renderChromeLite(){ // top bar badge + notice banner only
 const t=$('#top');if(!t)return;const keep=document.activeElement&&t.contains(document.activeElement);if(!keep){const sc=$('#sb').scrollTop;renderChrome();$('#sb').scrollTop=sc;}
}

document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.f;if(k){S.f[k]=e.target.value;if(k==='dmQ'){const l=$('#dmlist');if(l)l.innerHTML=dmList();}}});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset&&t.dataset.f;if(k){S.f[k]=t.value;if(t.dataset.rr)renderMain();if(S.user===null&&(k==='rCls'||k==='aCls'))return;}
 if(t.dataset&&t.dataset.file){const f=t.files&&t.files[0],kind=t.dataset.file;t.value='';if(f)handleFile(kind,f,t.dataset);}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;
 if(t.id==='cin'){e.preventDefault();sendFromInput(t.dataset.room);}
 else if(t.closest&&t.closest('#auth')&&t.tagName==='INPUT'){e.preventDefault();if(S.adm)A.submitAdm();else submitAuth();}});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(S.dirty&&!typing()&&S.user)renderMain();},150);});
async function handleFile(kind,f,d){
 try{
  if(kind==='pfp'){if(!isStaff())return toast('Only teachers can set a profile photo.');const x=await readFile(f,'img'),im=new Image();await new Promise(r=>{im.onload=r;im.src=x.data;});const c=document.createElement('canvas');c.width=c.height=160;const z=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-z)/2,(im.height-z)/2,z,z,0,0,160,160);
   await DB.set(S.user.u==='admin'?'settings/adminpfp':'users/'+S.user.u+'/pfp',c.toDataURL('image/jpeg',.8));toast('Profile photo updated.');renderChrome();return;}
  if(kind==='chatimg'){const x=await readFile(f,'img');await sendMsg(d.room,{k:'p',name:x.name,data:x.data});return;}
  if(kind==='chatpdf'){const x=await readFile(f,'pdf');toast('Sending PDF…');const pk=await packFile(x);await sendMsg(d.room,{k:'f',name:pk.name,data:pk.data||'',bid:pk.bid,n:pk.n});return;}
  if(kind==='libfile'){if(!isStaff())return toast('Only teachers can add files to the library.');const x=await readFile(f,'lib');setPB('upload',0,true);const pk=await packFile(x,p=>setPB('upload',p,true));setTimeout(()=>setPB('upload',0,false),900);S.file.lib={name:pk.name,data:pk.data||'',bid:pk.bid,n:pk.n,bytes:x.bytes};toast('File ready. Add a title and tap Publish.');renderMain();return;}
  const any=async()=>readFile(f,/^image\//.test(f.type)?'img':'pdf');
  if(kind==='hwfile'){S.file.hw=await any();renderMain();return;}
  if(kind==='hwsub'){const x=await any(),k='hw_'+d.id+'_'+S.user.u;await DB.set('files/'+k,await packFile(x));await DB.set(`hw/${d.id}/subs/${S.user.u}`,{name:S.user.name,fname:x.name,ts:Date.now()});toast('Answer submitted.');return;}
  if(kind==='receipt'){if(S.user.role!=='student')return;const m=S.f.feeMon||monthKey(),x=await any(),id=uid();toast('Sending receipt…');await DB.set('files/'+id,await packFile(x));await DB.set('receipts/'+id,{u:S.user.u,name:S.user.name,cls:S.user.cls,month:m,fname:x.name,status:'Sent',ts:Date.now()});toast('Receipt sent. The admin will review it.');renderMain();return;}
 }catch(err){toast(typeof err==='string'?err:'Could not use that file.');}
}
/* ====== start ====== */
(async function(){
 DB.cb=onData;DB.init();renderAll();
 if(DB.mode==='cloud'){await DB.whenReady(6000);S.connecting=false;renderAuth();}
 const ss=(()=>{try{return JSON.parse(localStorage.getItem('noon-session')||'null')}catch(e){return null}})();
 if(ss&&DB.ready){
  if(ss.u==='admin'&&ss.role==='admin')enter({u:'admin',name:'Admin',role:'admin'});
  else{const a=DB.get('users/'+ss.u);if(a&&a.role===ss.role)enter({u:ss.u,name:a.name,role:a.role,cls:a.cls});}
 }
})();
</script>
