<script>

const HOLE=/\{\{\s*([\w.$]+)\s*\}\}/g, PURE=/^\{\{\s*([\w.$]+)\s*\}\}$/;
const get=(p,sc)=>p.split('.').reduce((o,k)=>o==null?undefined:o[k],sc);
const sub=(s,sc)=>{const m=s.match(PURE); if(m) return get(m[1],sc); return s.replace(HOLE,(_,p)=>{const v=get(p,sc);return v==null?'':v;});};
function ev(node,sc,parent){
 for(const n of node.childNodes){
  if(n.nodeType===3){const v=sub(n.nodeValue,sc);parent.appendChild(document.createTextNode(v==null?'':String(v)));}
  else if(n.nodeType===1){
